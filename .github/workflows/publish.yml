# Publish to PyPI via Trusted Publishing (OIDC) — no API token stored anywhere.
#
# One-time setup on https://pypi.org (before the first run):
#   Account -> Publishing -> "Add a new pending publisher":
#     project name : lorawan2mqtt
#     owner        : lorawan2mqtt
#     repository   : lorawan2mqtt
#     workflow     : publish.yml
#     environment  : pypi
# Then trigger this workflow manually (Actions -> publish-pypi -> Run workflow).
name: publish-pypi

on:
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
