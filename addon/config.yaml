# Home Assistant add-on: lorawan2mqtt USB bridge
# Plug an Awaro LoRaWAN gateway into the HA server over USB: decoded sensor
# frames stream in as JSON lines and come out as MQTT discovery entities.
# No cloud, no WiFi, no LoRaWAN server — "the Zigbee dongle of LoRaWAN".
name: lorawan2mqtt USB bridge
version: "0.1.0"
slug: lorawan2mqtt
description: LoRaWAN sensors over a USB gateway, straight into MQTT / HA discovery
url: https://github.com/lorawan2mqtt/lorawan2mqtt
arch: [aarch64, amd64, armv7]
init: false
uart: true
services:
  - mqtt:need
options:
  serial_port: /dev/ttyUSB0
  baudrate: 115200
schema:
  serial_port: str
  baudrate: int
